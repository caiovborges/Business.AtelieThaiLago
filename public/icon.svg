<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" />
      <feGaussianBlur stdDeviation="2" />
    </filter>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#E6007E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC0CB;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="white" />
  <circle cx="256" cy="256" r="200" fill="url(#grad1)" filter="url(#watercolor)" opacity="0.8" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="serif" font-size="200" fill="white" font-weight="bold" filter="url(#watercolor)">TL</text>
</svg>
